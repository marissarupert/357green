<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>357 Green</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root {
  --slate: #242530;
  --slate-2: #2e2f3b;
  --paper: #f3f0eb;
  --ink: #242530;
  --white: #ffffff;
  --muted-dark: rgba(255,255,255,.94);
  --muted-light: rgba(36,37,48,.68);
  --rule-dark: rgba(255,255,255,.55);
  --rule-light: rgba(36,37,48,.3);
  --copper: #a5552f;
  --copper-2: #c26a3f;
  --font: "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
  --ease: cubic-bezier(.2,.7,.1,1);
  --gutter: clamp(16px, 4vw, 80px);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--slate);
  color: var(--white);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ---------- deck ---------- */
.deck {
  height: 100svh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.deck::-webkit-scrollbar { display: none; }
.slide {
  position: relative;
  min-height: 100svh;
  scroll-snap-align: start;
  display: grid;
  overflow: hidden;
}
.slide.dark { background: var(--slate); color: var(--white); }
.slide.light { background: var(--paper); color: var(--ink); }

/* ---------- reveal animation ---------- */
.rv { opacity: 0; transform: translateY(28px); transition: opacity .9s var(--ease), transform .9s var(--ease); }
.slide.in .rv { opacity: 1; transform: none; }
.slide.in .rv.d1 { transition-delay: .12s; }
.slide.in .rv.d2 { transition-delay: .28s; }
.slide.in .rv.d3 { transition-delay: .44s; }
.slide.in .rv.d4 { transition-delay: .6s; }

/* ---------- shared type ---------- */
.eyebrow { font-size: 13px; letter-spacing: .22em; text-transform: uppercase; font-weight: 500; color: var(--copper-2); }
.light .eyebrow { color: var(--copper); }
.display { font-weight: 400; line-height: .98; letter-spacing: -.01em; font-size: clamp(56px, 6.9vw, 140px); }
.h2 { font-weight: 400; line-height: 1.05; font-size: clamp(36px, 4.6vw, 84px); }
.body { font-weight: 400; font-size: clamp(17px, 1.5vw, 29px); line-height: 1.62; letter-spacing: -.012em; color: var(--muted-dark); max-width: 34em; }
.light .body { color: var(--muted-light); }
.kicker { font-weight: 600; font-size: clamp(17px, 1.5vw, 29px); line-height: 1.4; letter-spacing: -.012em; }

/* the copper-plus-hairline rule from the PDF */
.rule { position: relative; height: 6px; width: min(100%, 740px); }
.rule::before, .rule::after { content: ""; position: absolute; top: 50%; }
.rule::before {
  left: 0; width: 104px; height: 6px; margin-top: -3px;
  background: var(--copper); transform: skewX(-20deg) scaleX(0); transform-origin: left;
  transition: transform .7s var(--ease) .35s;
}
.rule::after {
  left: 108px; right: 0; height: 1px; background: var(--rule-dark);
  transform: scaleX(0); transform-origin: left; transition: transform 1.1s var(--ease) .55s;
}
.light .rule::after { background: var(--rule-light); }
.slide.in .rule::before { transform: skewX(-20deg) scaleX(1); }
.slide.in .rule::after { transform: scaleX(1); }

/* building logo, top left of every slide; the PNG is white, darkened on light slides */
.slide-top {
  position: absolute; top: 20px; left: var(--gutter); z-index: 3;
  display: flex; align-items: center; gap: 20px;
}
.logo { display: block; width: clamp(84px, 7vw, 132px); height: auto; filter: drop-shadow(0 1px 6px rgba(36,37,48,.35)); }
.light .logo { filter: brightness(0); opacity: .86; }

/* placeholder tag for slides awaiting content */
.ph {
  font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
  padding: 5px 10px; border: 1px dashed currentColor; opacity: .55;
}

/* ---------- hero (split) ---------- */
.hero { grid-template-columns: 58.5fr 41.5fr; }
.hero .copy {
  display: flex; flex-direction: column; justify-content: center;
  gap: clamp(28px, 4.2vh, 64px);
  padding: max(8vh, 104px) var(--gutter) 8vh calc(var(--gutter) * .9);
}
.hero .copy .body { margin-top: clamp(8px, 2vh, 32px); }
.hero .media { position: relative; overflow: hidden; }
.hero .media img {
  position: absolute; inset: -3%; width: 106%; height: 106%;
  object-fit: cover; object-position: 50% 30%;
  transform: scale(1.12) translate3d(var(--px, 0), var(--py, 0), 0);
  transition: transform 2.4s var(--ease);
}
.hero.in .media img { transform: scale(1) translate3d(var(--px, 0), var(--py, 0), 0); }
.hero .media::after { /* soft seam where photo meets slate */
  content: ""; position: absolute; inset: 0 auto 0 0; width: 18%;
  background: linear-gradient(90deg, rgba(36,37,48,.35), transparent);
  pointer-events: none;
}
.hero.reverse { grid-template-columns: 41.5fr 58.5fr; }
.hero.reverse .media { order: -1; }
.hero.reverse .media::after { inset: 0 0 0 auto; background: linear-gradient(270deg, rgba(36,37,48,.25), transparent); }

/* ---------- statement ---------- */
.statement { place-items: center; text-align: center; padding: 12vh var(--gutter); }
.statement .inner { display: grid; gap: 36px; justify-items: center; max-width: 1200px; }
.statement .rule { width: min(60vw, 520px); }

/* ---------- stats ---------- */
.stats { align-content: center; padding: 12vh var(--gutter); gap: clamp(32px, 6vh, 72px); }
.stats .head { display: grid; gap: 20px; max-width: 900px; }
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--rule-light); }
.dark .stat-grid { border-top-color: var(--rule-dark); }
.stat { padding: 28px 24px 8px 0; display: grid; gap: 10px; }
.stat + .stat { padding-left: 24px; border-left: 1px solid var(--rule-light); }
.dark .stat + .stat { border-left-color: var(--rule-dark); }
.stat .num { font-size: clamp(44px, 5vw, 96px); font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .num sup { font-size: .4em; color: var(--copper); margin-left: 2px; }
.stat .lbl { font-size: 14px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; }

/* ---------- features (expandable list) ---------- */
.features { grid-template-columns: 1fr 1.2fr; gap: clamp(32px, 6vw, 120px); align-items: center; padding: 12vh var(--gutter); }
.features .head { display: grid; gap: 28px; }
.acc { border-top: 1px solid var(--rule-dark); }
.light .acc { border-top-color: var(--rule-light); }
.acc-item { border-bottom: 1px solid var(--rule-dark); }
.light .acc-item { border-bottom-color: var(--rule-light); }
.acc-btn {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 20px;
  padding: 26px 0; text-align: left; font-size: clamp(20px, 1.8vw, 32px); font-weight: 400;
}
.acc-btn .idx { font-size: 13px; letter-spacing: .14em; color: var(--copper-2); margin-right: 20px; }
.light .acc-btn .idx { color: var(--copper); }
.acc-btn .pm { width: 18px; height: 18px; position: relative; flex: none; }
.acc-btn .pm::before, .acc-btn .pm::after {
  content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1.5px; margin-top: -.75px;
  background: currentColor; transition: transform .4s var(--ease);
}
.acc-btn .pm::after { transform: rotate(90deg); }
.acc-item.open .pm::after { transform: rotate(0deg); }
.acc-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s var(--ease); }
.acc-item.open .acc-panel { grid-template-rows: 1fr; }
.acc-panel > div { overflow: hidden; }
.acc-panel p { padding: 0 0 28px 54px; font-size: 18px; line-height: 1.65; opacity: .75; max-width: 36em; }

/* ---------- contact ---------- */
.contact { align-content: center; justify-items: start; padding: 12vh var(--gutter); gap: 36px; }
.cta {
  display: inline-flex; align-items: center; gap: 14px;
  padding: 18px 30px; border: 1px solid var(--copper-2); color: var(--white);
  font-size: 15px; letter-spacing: .18em; text-transform: uppercase; text-decoration: none;
  background: linear-gradient(var(--copper), var(--copper)) no-repeat left / 0 100%;
  transition: background-size .5s var(--ease);
}
.cta:hover, .cta:focus-visible { background-size: 100% 100%; }
.cta span { transition: transform .4s var(--ease); }
.cta:hover span { transform: translateX(6px); }

/* ---------- parallax ---------- */
[data-speed] { will-change: translate; }

/* ---------- chrome: chevrons, counter ---------- */
.nav-arrows {
  position: fixed; right: 22px; bottom: 18px; z-index: 10;
  display: grid; gap: 10px;
}
.chev {
  width: 44px; height: 44px; border-radius: 50%;
  border: 2px solid var(--white); display: grid; place-items: center;
  background: rgba(36,37,48,.18); backdrop-filter: blur(4px);
  transition: background .25s, opacity .25s, transform .25s var(--ease);
}
.chev:hover { background: var(--copper); border-color: var(--copper); transform: scale(1.06); }
.chev:disabled { opacity: .3; pointer-events: none; }
.chev svg { width: 18px; height: 18px; stroke: var(--white); }
body.on-light .chev { border-color: var(--ink); background: rgba(243,240,235,.6); }
body.on-light .chev svg { stroke: var(--ink); }
body.on-light .chev:hover { background: var(--copper); border-color: var(--copper); }
body.on-light .chev:hover svg { stroke: var(--white); }


.counter {
  position: fixed; left: var(--gutter); bottom: 22px; z-index: 10;
  font-size: 13px; letter-spacing: .2em; font-variant-numeric: tabular-nums;
  display: flex; align-items: center; gap: 14px; color: var(--muted-dark);
}
.counter .bar { width: 80px; height: 1px; background: var(--rule-dark); position: relative; }
.counter .bar i { position: absolute; inset: 0 auto 0 0; background: var(--copper-2); transition: width .5s var(--ease); }
body.on-light .counter { color: var(--muted-light); }
body.on-light .counter .bar { background: var(--rule-light); }


:focus-visible { outline: 2px solid var(--copper-2); outline-offset: 3px; }

/* ---------- menu ---------- */
.burger {
  position: fixed; top: 18px; right: 22px; z-index: 30;
  width: 48px; height: 48px; border-radius: 50%;
  border: 2px solid var(--white); background: rgba(36,37,48,.18); backdrop-filter: blur(4px);
  display: grid; place-items: center;
  transition: background .25s, border-color .25s, transform .25s var(--ease);
}
.burger:hover { background: var(--copper); border-color: var(--copper); transform: scale(1.06); }
.burger .lines { position: relative; width: 18px; height: 12px; }
.burger .lines i {
  position: absolute; left: 0; right: 0; height: 2px; background: var(--white); border-radius: 1px;
  transition: transform .4s var(--ease), opacity .2s, top .4s var(--ease);
}
.burger .lines i:nth-child(1) { top: 0; }
.burger .lines i:nth-child(2) { top: 5px; }
.burger .lines i:nth-child(3) { top: 10px; }
body.menu-open .burger .lines i:nth-child(1) { top: 5px; transform: rotate(45deg); }
body.menu-open .burger .lines i:nth-child(2) { opacity: 0; }
body.menu-open .burger .lines i:nth-child(3) { top: 5px; transform: rotate(-45deg); }
body.on-light:not(.menu-open) .burger { border-color: var(--ink); background: rgba(243,240,235,.6); }
body.on-light:not(.menu-open) .burger .lines i { background: var(--ink); }
body.on-light:not(.menu-open) .burger:hover { border-color: var(--copper); background: var(--copper); }
body.on-light:not(.menu-open) .burger:hover .lines i { background: var(--white); }

.menu {
  position: fixed; inset: 0; z-index: 20;
  display: grid; grid-template-columns: 58.5fr 41.5fr;
  background: var(--slate); color: var(--white);
  clip-path: inset(0 0 100% 0); visibility: hidden;
  transition: clip-path .7s var(--ease), visibility 0s .7s;
}
body.menu-open .menu { clip-path: inset(0); visibility: visible; transition: clip-path .7s var(--ease), visibility 0s; }
.menu-list {
  display: flex; flex-direction: column; justify-content: center; gap: 28px;
  padding: 10vh var(--gutter);
}
.menu-list ol { list-style: none; display: grid; }
.menu-link {
  display: flex; align-items: baseline; gap: 24px; width: 100%; text-align: left;
  padding: clamp(10px, 1.6vh, 18px) 0; border-bottom: 1px solid rgba(255,255,255,.14);
  font-size: clamp(28px, 3.4vw, 60px); font-weight: 400; line-height: 1.1;
  opacity: 0; transform: translateY(24px);
  transition: opacity .6s var(--ease), transform .6s var(--ease), color .25s;
}
body.menu-open .menu-link { opacity: 1; transform: none; transition-delay: calc(.25s + var(--i) * .06s), calc(.25s + var(--i) * .06s), 0s; }
.menu-link .n { font-size: 13px; letter-spacing: .18em; color: var(--copper-2); font-variant-numeric: tabular-nums; min-width: 2em; }
.menu-link .t { position: relative; }
.menu-link .t::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 3px;
  background: var(--copper); transform: skewX(-20deg) scaleX(0); transform-origin: left;
  transition: transform .45s var(--ease);
}
.menu-link:hover .t::after, .menu-link:focus-visible .t::after, .menu-link.active .t::after { transform: skewX(-20deg) scaleX(1); }
.menu-link:not(.active):not(:hover) { color: rgba(255,255,255,.8); }
.menu-media { position: relative; overflow: hidden; }
.menu-media img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%;
  transform: scale(1.15); transition: transform 1.4s var(--ease);
}
body.menu-open .menu-media img { transform: scale(1); }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .deck { scroll-snap-type: y proximity; }
  .hero, .hero.reverse { grid-template-columns: 1fr; grid-template-rows: 46svh auto; }
  .hero .media, .hero.reverse .media { order: -1; }
  .counter { display: none; }
  .hero .copy { padding: 40px var(--gutter) 96px; gap: 28px; }
  .hero .media::after { inset: auto 0 0 0; width: auto; height: 30%; background: linear-gradient(0deg, rgba(36,37,48,.6), transparent); }
  .features { grid-template-columns: 1fr; padding-bottom: 96px; }
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .stat:nth-child(3) { padding-left: 0; border-left: 0; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--rule-light); }
  .dark .stat:nth-child(n+3) { border-top-color: var(--rule-dark); }
  .burger { top: 14px; right: 16px; width: 44px; height: 44px; background: rgba(36,37,48,.7); }
  .menu { grid-template-columns: 1fr; }
  .menu-media { display: none; }
  .nav-arrows { right: 16px; bottom: 16px; }
  .chev { width: 40px; height: 40px; background: rgba(36,37,48,.7); }
  .acc-panel p { padding-left: 0; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition-duration: .01ms !important; transition-delay: 0s !important; }
}
</style>
</head>
<body>

<button class="burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
  <span class="lines" aria-hidden="true"><i></i><i></i><i></i></span>
</button>

<div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Sections">
  <div class="menu-list">
    <p class="eyebrow">357 Green</p>
    <ol id="menu-items"></ol>
  </div>
  <div class="menu-media"><img src="" alt="" id="menu-img"></div>
</div>

<main class="deck" id="deck" aria-label="357 Green presentation"></main>

<div class="counter" aria-hidden="true">
  <span id="cur">01</span><span class="bar"><i id="bar"></i></span><span id="tot">01</span>
</div>

<div class="nav-arrows">
  <button class="chev" id="prev" aria-label="Previous section">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
  </button>
  <button class="chev" id="next" aria-label="Next section">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  </button>
</div>

<script>
/* ---------- data ----------
   One entry per section. `layout` picks the renderer below.
   `placeholder: true` marks a section still waiting on content from the PDF. */
const IMG = {
  tower: "assets/tower.jpg",
  logo: "assets/logo.png",
};

const SLIDES = [
  {
    id: "new-standard", nav: "The New Standard", layout: "hero", theme: "dark",
    title: ["The New", "Standard"],
    body: "The office market has entered a new phase. Progressive, employee-centric organizations now prioritize quality as the most important workplace criterion, for the benefit of people, culture, and, simply put, the joy of work. Fulton Market has entered a new phase, too. It’s now a mature submarket with a single premier office development site remaining, 357 Green.",
    kicker: "Take the opportunity to make a forever mark on Chicago’s skyline.",
    img: "tower", alt: "Rendering of the 357 Green tower against the Chicago skyline at dusk",
  },
  {
    id: "statement", nav: "Statement", layout: "statement", theme: "light", placeholder: true,
    eyebrow: "Section eyebrow",
    title: "A single, large statement line for the next page goes here.",
  },
  {
    id: "by-the-numbers", nav: "By the Numbers", layout: "stats", theme: "dark", placeholder: true,
    eyebrow: "By the numbers",
    title: "Building facts headline",
    stats: [
      { num: "000,000", unit: "SF", lbl: "Stat label" },
      { num: "00", unit: "", lbl: "Stat label" },
      { num: "00,000", unit: "SF", lbl: "Stat label" },
      { num: "0000", unit: "", lbl: "Stat label" },
    ],
  },
  {
    id: "features", nav: "Features", layout: "features", theme: "light", placeholder: true,
    eyebrow: "Amenities & features",
    title: "Expandable feature list",
    body: "Each row opens to a short description. Good for amenities, sustainability, or the tenant experience.",
    items: [
      { t: "Feature one", d: "Supporting description for this feature." },
      { t: "Feature two", d: "Supporting description for this feature." },
      { t: "Feature three", d: "Supporting description for this feature." },
      { t: "Feature four", d: "Supporting description for this feature." },
    ],
  },
  {
    id: "split-reverse", nav: "Image Left", layout: "hero", theme: "dark", reverse: true, placeholder: true,
    title: ["Split Layout", "Reversed"],
    body: "The same split as the opening page with the image on the left, for alternating rhythm between sections.",
    kicker: "Bold closing line for the section.",
    img: "tower", alt: "",
  },
  {
    id: "contact", nav: "Contact", layout: "contact", theme: "dark", placeholder: true,
    eyebrow: "Next steps",
    title: "Let’s talk about 357 Green.",
    body: "Leasing contact names, phone numbers, and email go here.",
    cta: { label: "Schedule a tour", href: "#" },
  },
];

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");

/* ---------- renderers ---------- */
const R = {
  hero: s => `
    <div class="copy" data-fade>
      <h1 class="display rv" data-speed="-.22">${s.title.map(esc).join("<br>")}</h1>
      <div class="rule" aria-hidden="true" data-speed="-.14"></div>
      <p class="body rv d2" data-speed="-.08">${esc(s.body)}</p>
      ${s.kicker ? `<p class="kicker rv d3" data-speed="-.03">${esc(s.kicker)}</p>` : ""}
    </div>
    <div class="media"><img data-speed=".3" src="${esc(IMG[s.img])}" alt="${esc(s.alt)}" ${s.alt ? "" : 'aria-hidden="true"'}></div>`,

  statement: s => `
    <div class="inner" data-fade>
      <p class="eyebrow rv" data-speed="-.18">${esc(s.eyebrow)}</p>
      <h2 class="h2 rv d1" data-speed="-.1">${esc(s.title)}</h2>
      <div class="rule" aria-hidden="true"></div>
    </div>`,

  stats: s => `
    <div class="head" data-fade>
      <p class="eyebrow rv" data-speed="-.2">${esc(s.eyebrow)}</p>
      <h2 class="h2 rv d1" data-speed="-.14">${esc(s.title)}</h2>
    </div>
    <div class="stat-grid" data-speed="-.05">
      ${s.stats.map((x, i) => `
        <div class="stat rv d${Math.min(i + 1, 4)}">
          <span class="num">${esc(x.num)}${x.unit ? `<sup>${esc(x.unit)}</sup>` : ""}</span>
          <span class="lbl">${esc(x.lbl)}</span>
        </div>`).join("")}
    </div>`,

  features: s => `
    <div class="head">
      <p class="eyebrow rv">${esc(s.eyebrow)}</p>
      <h2 class="h2 rv d1">${esc(s.title)}</h2>
      <div class="rule" aria-hidden="true"></div>
      <p class="body rv d2">${esc(s.body)}</p>
    </div>
    <div class="acc rv d2">
      ${s.items.map((x, i) => `
        <div class="acc-item${i === 0 ? " open" : ""}">
          <button class="acc-btn" aria-expanded="${i === 0}" aria-controls="${esc(s.id)}-p${i}">
            <span><span class="idx">${pad(i + 1)}</span>${esc(x.t)}</span><span class="pm" aria-hidden="true"></span>
          </button>
          <div class="acc-panel" id="${esc(s.id)}-p${i}" role="region"><div><p>${esc(x.d)}</p></div></div>
        </div>`).join("")}
    </div>`,

  contact: s => `
    <p class="eyebrow rv">${esc(s.eyebrow)}</p>
    <h2 class="display rv d1" style="font-size:clamp(48px,6.4vw,128px)">${esc(s.title)}</h2>
    <div class="rule" aria-hidden="true"></div>
    <p class="body rv d2">${esc(s.body)}</p>
    <a class="cta rv d3" href="${esc(s.cta.href)}">${esc(s.cta.label)} <span aria-hidden="true">&rarr;</span></a>`,
};

/* ---------- build ---------- */
const deck = document.getElementById("deck");

deck.innerHTML = SLIDES.map((s, i) => `
  <section class="slide ${s.layout} ${s.theme}${s.reverse ? " reverse" : ""}" id="${esc(s.id)}" data-i="${i}" aria-label="${esc(s.nav)}">
    <div class="slide-top">
      <img class="logo" src="${IMG.logo}" alt="${i === 0 ? "357 Green" : ""}">
      ${s.placeholder ? '<span class="ph">Placeholder</span>' : ""}
    </div>
    ${R[s.layout](s)}
  </section>`).join("");

const slides = [...deck.querySelectorAll(".slide")];
document.getElementById("tot").textContent = pad(slides.length);

/* ---------- navigation ---------- */
let current = 0;
const go = i => {
  i = Math.max(0, Math.min(slides.length - 1, i));
  slides[i].scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
};

const setActive = i => {
  current = i;
  document.getElementById("cur").textContent = pad(i + 1);
  document.getElementById("bar").style.width = `${((i + 1) / slides.length) * 100}%`;
  document.getElementById("prev").disabled = i === 0;
  document.getElementById("next").disabled = i === slides.length - 1;
  document.body.classList.toggle("on-light", SLIDES[i].theme === "light");
  history.replaceState(null, "", `#${SLIDES[i].id}`);
};

document.getElementById("prev").onclick = () => go(current - 1);
document.getElementById("next").onclick = () => go(current + 1);

/* ---------- menu ---------- */
const menu = document.getElementById("menu");
const burger = document.getElementById("burger");
const menuItems = document.getElementById("menu-items");
document.getElementById("menu-img").src = IMG.tower;
menuItems.innerHTML = SLIDES.map((s, i) => `
  <li><button class="menu-link" data-i="${i}" style="--i:${i}">
    <span class="n">${pad(i + 1)}</span><span class="t">${esc(s.nav)}</span>
  </button></li>`).join("");
const menuLinks = [...menuItems.querySelectorAll(".menu-link")];
const chrome = [deck, document.querySelector(".nav-arrows")];

const setMenu = open => {
  document.body.classList.toggle("menu-open", open);
  burger.setAttribute("aria-expanded", open);
  burger.setAttribute("aria-label", open ? "Close menu" : "Open menu");
  chrome.forEach(el => { el.inert = open; });
  if (open) {
    menuLinks.forEach((l, j) => l.classList.toggle("active", j === current));
    setTimeout(() => menuLinks[current].focus({ preventScroll: true }), 300);
  } else {
    burger.focus({ preventScroll: true });
  }
};
const menuOpen = () => document.body.classList.contains("menu-open");
burger.onclick = () => setMenu(!menuOpen());
menuItems.addEventListener("click", e => {
  const l = e.target.closest(".menu-link");
  if (!l) return;
  setMenu(false);
  slides[+l.dataset.i].scrollIntoView(); // jump directly; the curtain covers the move
});

addEventListener("keydown", e => {
  if (menuOpen()) {
    if (e.key === "Escape") setMenu(false);
    else if (e.key === "Tab") { // keep focus inside the menu
      const f = [burger, ...menuLinks], i = f.indexOf(document.activeElement);
      e.preventDefault();
      f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
    } else if (["ArrowDown", "ArrowUp"].includes(e.key)) {
      e.preventDefault();
      const i = menuLinks.indexOf(document.activeElement);
      menuLinks[(i + (e.key === "ArrowDown" ? 1 : -1) + menuLinks.length) % menuLinks.length].focus();
    }
    return;
  }
  if (e.target.closest("button, a, input, textarea") && e.key === " ") return;
  const k = e.key;
  if (["ArrowDown", "PageDown", " "].includes(k)) { e.preventDefault(); go(current + 1); }
  else if (["ArrowUp", "PageUp"].includes(k)) { e.preventDefault(); go(current - 1); }
  else if (k === "Home") { e.preventDefault(); go(0); }
  else if (k === "End") { e.preventDefault(); go(slides.length - 1); }
});

/* active slide + reveal-on-enter */
const io = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (en.isIntersecting) {
      en.target.classList.add("in");
      if (en.intersectionRatio >= .5) setActive(+en.target.dataset.i);
    }
  });
}, { root: deck, threshold: [.25, .5] });
slides.forEach(s => io.observe(s));

/* ---------- accordion ---------- */
deck.addEventListener("click", e => {
  const b = e.target.closest(".acc-btn");
  if (!b) return;
  const item = b.parentElement;
  const open = !item.classList.contains("open");
  item.parentElement.querySelectorAll(".acc-item").forEach(x => {
    x.classList.remove("open");
    x.querySelector(".acc-btn").setAttribute("aria-expanded", "false");
  });
  if (open) { item.classList.add("open"); b.setAttribute("aria-expanded", "true"); }
});

/* ---------- subtle image parallax on pointer ---------- */
if (!matchMedia("(prefers-reduced-motion: reduce)").matches && matchMedia("(pointer: fine)").matches) {
  deck.querySelectorAll(".hero .media").forEach(m => {
    const img = m.querySelector("img");
    m.addEventListener("pointermove", e => {
      const r = m.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      img.style.transition = "transform .6s var(--ease)";
      img.style.setProperty("--px", `${(-x * 18).toFixed(1)}px`);
      img.style.setProperty("--py", `${(-y * 18).toFixed(1)}px`);
    });
    m.addEventListener("pointerleave", () => { img.style.setProperty("--px", "0px"); img.style.setProperty("--py", "0px"); });
  });
}

/* ---------- scroll parallax ----------
   p is each slide's offset from the top of the viewport in screen heights
   (0 = in place, -1 = scrolled one screen past, 1 = one screen below).
   Every [data-speed] layer shifts by -p * speed * screen height, so positive
   speeds lag behind the scroll (photos) and negative ones lead it. */
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
  const layers = slides.map(sl => ({
    sl,
    items: [...sl.querySelectorAll("[data-speed]")].map(el => ({ el, speed: +el.dataset.speed })),
    fades: [...sl.querySelectorAll("[data-fade]")],
  }));
  let ticking = false;
  const update = () => {
    ticking = false;
    const H = deck.clientHeight, top = deck.scrollTop;
    // On phones sections can run taller than the screen, so text stays put and
    // only the photo moves (with less travel for the shorter crop).
    const mobile = innerWidth <= 900, k = mobile ? .4 : 1;
    layers.forEach(({ sl, items, fades }) => {
      const p = (sl.offsetTop - top) / H;
      if (p < -1.2 || p > 1.2) return;
      items.forEach(({ el, speed }) => {
        el.style.translate = mobile && speed < 0 ? "" : `0 ${(-p * speed * H * k).toFixed(1)}px`;
      });
      const fade = mobile ? 1 : Math.max(0, Math.min(1, 1 + p * 1.6)); // fades only while leaving upward
      fades.forEach(f => { f.style.opacity = fade.toFixed(3); });
    });
  };
  deck.addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } }, { passive: true });
  addEventListener("resize", update);
  update();
}

/* deep link on load */
const start = SLIDES.findIndex(s => `#${s.id}` === location.hash);
if (start > 0) slides[start].scrollIntoView();
</script>
</body>
</html>
