<title>357 Green Floor Plans</title>
<style>
/* ---------- brand tokens ---------- */
:root {
  --midnight: #1C1D2B;   /* background, panel */
  --powder: #ABBDCC;     /* program linework, primary labels */
  --slate: #717E80;      /* context massing, streets, secondary labels */
  --espresso: #513B2D;   /* program fills at rest */
  --rust: #A5552F;       /* accent: hovered / selected piece, circulation line */

  --font: "Futura 100", Futura, "Century Gothic", sans-serif;
  --w-regular: 400;      /* piece names (headlines) */
  --w-book: 300;         /* descriptions, labels (subheaders) */

  --hair: 1px;
  --gutter: clamp(16px, 3vw, 40px);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--midnight); color: var(--powder); }
body {
  font-family: var(--font);
  font-weight: var(--w-book);
  text-transform: lowercase;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-transform: inherit; }

/* ---------- frame ---------- */
.app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) clamp(240px, 24vw, 340px);
  grid-template-rows: auto minmax(0, 1fr);
  gap: 0 var(--gutter);
  padding: var(--gutter);
  min-height: 100vh;
}
.top {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: var(--gutter);
  padding-bottom: clamp(12px, 2vw, 24px);
  border-bottom: var(--hair) solid color-mix(in srgb, var(--slate) 50%, transparent);
  margin-bottom: clamp(12px, 2vw, 24px);
}
#logo { width: clamp(64px, 7vw, 96px); height: auto; flex: none; }
.tabs { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.tab {
  font-size: 13px; letter-spacing: .08em;
  padding: 6px 12px; color: var(--slate);
  border: var(--hair) solid transparent;
}
.tab[aria-selected="true"] { color: var(--powder); border-color: color-mix(in srgb, var(--powder) 45%, transparent); }

.stage { position: relative; min-width: 0; }
.stage svg { display: block; width: 100%; height: auto; }

.panel {
  border-left: var(--hair) solid color-mix(in srgb, var(--slate) 50%, transparent);
  padding-left: var(--gutter);
  display: flex; flex-direction: column; gap: 16px;
}
.panel h1 { font-weight: var(--w-regular); font-size: clamp(22px, 2vw, 30px); line-height: 1.1; color: var(--powder); }
.panel .meta { font-size: 12px; letter-spacing: .06em; color: var(--slate); line-height: 1.6; }
.panel .legend { list-style: none; display: grid; gap: 8px; font-size: 14px; margin-top: 8px; }
.panel .legend li { display: flex; align-items: center; gap: 10px; }
.panel .legend i { width: 14px; height: 10px; background: var(--espresso); border: var(--hair) solid var(--powder); }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto auto; min-height: 0; }
  .panel { border-left: 0; padding-left: 0; border-top: var(--hair) solid color-mix(in srgb, var(--slate) 50%, transparent); padding-top: 16px; margin-top: 16px; }
}

/* ---------- drawing ---------- */
svg text { font-family: var(--font); }
.ground { fill: var(--midnight); }
.street { fill: var(--midnight); stroke: var(--slate); stroke-width: .8; }
.curb { stroke: var(--slate); stroke-width: .8; }
.lane { fill: none; stroke: var(--slate); stroke-width: .6; opacity: .55; }
.lane.dash { stroke-dasharray: 18 14; }
.mass { fill: color-mix(in srgb, var(--slate) 22%, var(--midnight)); stroke: var(--slate); stroke-width: .8; }
.mass-dark { fill: color-mix(in srgb, var(--slate) 12%, var(--midnight)); stroke: var(--slate); stroke-width: .8; }

.piece .roof,
.piece .stair-tread, .piece .seat-tread { fill: var(--espresso); stroke: var(--powder); stroke-width: .9; stroke-linejoin: round; }
.piece .face,
.piece .stair-riser, .piece .seat-riser,
.piece .stair-cheek, .piece .seat-cheek { fill: color-mix(in srgb, var(--espresso) 62%, var(--midnight)); stroke: var(--powder); stroke-width: .9; stroke-linejoin: round; }
.piece .stair-riser, .piece .stair-tread, .piece .seat-riser, .piece .seat-tread { stroke-width: .6; }
.detail { stroke: var(--powder); stroke-width: .6; opacity: .7; }
.mullion { stroke: var(--powder); stroke-width: .5; opacity: .35; }

.arrow { stroke: var(--powder); stroke-width: 1.2; }
.arrowhead { fill: var(--powder); }
.arc { fill: none; stroke: var(--powder); stroke-width: 1; stroke-dasharray: 2 6; opacity: .85; }

.lbl { fill: var(--powder); font-weight: var(--w-regular); font-size: 19px; letter-spacing: .04em; }
.lbl-ctx { fill: var(--slate); font-weight: var(--w-book); font-size: 17px; letter-spacing: .06em; }
</style>
</head>

/* ---------- static render: fill copy into the drawing ---------- */
(function () {
  const id = "podium";
  const plan = PLANS[id];
  const svg = document.getElementById("plan_" + id);

  svg.querySelectorAll("[data-copy]").forEach(el => {
    const val = el.dataset.copy.split(".").reduce((o, k) => o && o[k], plan);
    if (typeof val === "string") el.textContent = val;
  });

  document.getElementById("panel_title").textContent = plan.title;
  document.getElementById("panel_meta").textContent = plan.meta;
  document.getElementById("legend").innerHTML =
    Object.values(plan.pieces).map(p => `<li><i></i>${p.name}</li>`).join("");

  document.getElementById("tabs").innerHTML = Object.entries(PLANS).map(([k, p]) =>
    `<button class="tab" role="tab" aria-selected="${k === id}">${p.tab}</button>`).join("");
})();
</script>
