<title>357 Green Floor Plans</title>
<style>
/* ---------- brand tokens ---------- */
:root {
  --midnight: #1C1D2B;
  --powder: #ABBDCC;
  --slate: #717E80;
  --espresso: #513B2D;
  --rust: #A5552F;       /* accent: hovered / selected piece, circulation line */
  --paper: #FFFFFF;      /* slide background */

  /* one brand color per program piece */
  --c-retail: var(--espresso);
  --c-residential_lobby: var(--powder);
  --c-residential_bike_room: var(--slate);
  --c-activated_plaza: color-mix(in srgb, var(--espresso) 32%, var(--paper));
  --c-paseo: var(--midnight);

  --font: "Futura 100", Futura, "Century Gothic", sans-serif;
  --w-regular: 400;      /* piece names, slide titles (headlines) */
  --w-book: 300;         /* descriptions, labels, key (subheaders) */

  --hair: 1px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--paper); color: var(--midnight); height: 100%; }
body {
  font-family: var(--font);
  font-weight: var(--w-book);
  text-transform: lowercase;
  -webkit-font-smoothing: antialiased;
  display: grid; place-items: center;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-transform: inherit; }

/* ---------- deck: a 16:9 frame that scales to its container ---------- */
.deck {
  container-type: inline-size;
  position: relative;
  width: min(100vw, calc(100vh * 16 / 9));
  aspect-ratio: 16 / 9;
  background: var(--paper);
  display: grid;
  grid-template-columns: minmax(0, 1fr) 28%;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 0 3cqw;
  padding: 2.6cqw 3cqw 2cqw;
  overflow: hidden;
}
.hair-b { border-bottom: var(--hair) solid color-mix(in srgb, var(--slate) 45%, transparent); }
.hair-t { border-top: var(--hair) solid color-mix(in srgb, var(--slate) 45%, transparent); }

.top { grid-column: 1 / -1; display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 1.2cqw; margin-bottom: 1.4cqw; }
#logo { width: clamp(56px, 6.5cqw, 120px); height: auto; display: block; }
.eyebrow { font-size: clamp(11px, 1.05cqw, 18px); letter-spacing: .14em; font-weight: var(--w-regular); }

.stage { position: relative; min-width: 0; min-height: 0; display: grid; place-items: center; }
.stage svg { display: block; width: 100%; height: 100%; max-height: 100%; }

.side { min-height: 0; display: flex; flex-direction: column; gap: 1.1cqw; padding-left: 2cqw;
  border-left: var(--hair) solid color-mix(in srgb, var(--slate) 45%, transparent); overflow: auto; }
.side h1 { font-weight: var(--w-regular); font-size: clamp(18px, 2.3cqw, 40px); line-height: 1.05; }
.side .body { font-size: clamp(12px, 1.05cqw, 19px); line-height: 1.55; min-height: 4.8em; }

.controls { display: flex; flex-wrap: wrap; gap: .5cqw; }
.btn { font-size: clamp(10px, .85cqw, 15px); letter-spacing: .08em; padding: .45em .9em;
  border: var(--hair) solid color-mix(in srgb, var(--midnight) 35%, transparent); }
.btn:hover, .btn:focus-visible { border-color: var(--midnight); outline: none; }
.btn[aria-pressed="true"] { border-color: var(--rust); color: var(--rust); }

.key { margin-top: auto; }
.key h3 { font-weight: var(--w-regular); font-size: clamp(10px, .85cqw, 15px); letter-spacing: .14em; padding-bottom: .6em; margin-bottom: .7em; }
.key ul { list-style: none; display: grid; gap: .5em; font-size: clamp(10px, .85cqw, 15px); }
.key li { display: flex; align-items: center; gap: .8em; }
.key li + li.gap { margin-top: .5em; }
.key button { display: flex; align-items: center; gap: .8em; text-align: left; }
.key button:focus-visible { outline: var(--hair) solid var(--midnight); outline-offset: 3px; }
.key svg { width: 2.6em; height: 1.1em; flex: none; overflow: visible; }

.foot { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 2cqw;
  padding-top: 1cqw; margin-top: 1.2cqw; font-size: clamp(9px, .8cqw, 14px); letter-spacing: .08em; color: var(--slate); }
.nav { display: flex; align-items: center; gap: 1cqw; color: var(--midnight); }
.nav button { width: 2.4em; height: 2.4em; display: grid; place-items: center;
  border: var(--hair) solid color-mix(in srgb, var(--midnight) 35%, transparent); }
.nav button:hover, .nav button:focus-visible { border-color: var(--midnight); outline: none; }
.nav button:disabled { opacity: .3; cursor: default; }
.dots { display: flex; gap: .45em; }
.dots i { width: .45em; height: .45em; border-radius: 50%; background: color-mix(in srgb, var(--slate) 45%, transparent); }
.dots i.on { background: var(--rust); }

/* cover slide */
.cover { position: absolute; inset: 0; background: var(--paper); display: grid; align-content: center;
  padding: 0 8cqw; gap: 1.6cqw; opacity: 0; pointer-events: none; transition: opacity 400ms ease; }
.deck.is-cover .cover { opacity: 1; pointer-events: auto; }
.cover .logo-lg { width: clamp(120px, 18cqw, 340px); height: auto; }
.cover h1 { font-weight: var(--w-regular); font-size: clamp(28px, 5cqw, 96px); line-height: 1; }
.cover h2 { font-weight: var(--w-book); font-size: clamp(14px, 1.6cqw, 30px); color: var(--slate); }
.cover .bar { width: 6cqw; height: 2px; background: var(--rust); }
.cover .start { justify-self: start; margin-top: 1cqw; }

/* phones: stack the slide instead of letterboxing it */
@media (max-width: 720px) {
  body { display: block; overflow: auto; }
  .deck { width: 100%; aspect-ratio: auto; min-height: 100svh; grid-template-columns: 1fr; grid-template-rows: auto auto auto auto; padding: 16px; gap: 0; }
  .side { border-left: 0; padding-left: 0; padding-top: 16px; gap: 14px; overflow: visible; }
  .key { margin-top: 8px; }
  .foot { flex-wrap: wrap; }
  .cover { padding: 0 16px; }
}

/* ---------- drawing ---------- */
svg text { font-family: var(--font); }
.ground { fill: var(--paper); }
.street { fill: var(--paper); stroke: var(--slate); stroke-width: .8; }
.curb { stroke: var(--slate); stroke-width: .8; }
.lane { fill: none; stroke: var(--slate); stroke-width: .6; opacity: .55; }
.lane.dash { stroke-dasharray: 18 14; }
.mass { fill: color-mix(in srgb, var(--slate) 14%, var(--paper)); stroke: var(--slate); stroke-width: .8; }
.mass-dark { fill: color-mix(in srgb, var(--slate) 26%, var(--paper)); stroke: var(--slate); stroke-width: .8; }

/* program pieces: fill from the piece color, white monoline edges */
#retail                { --fill: var(--c-retail);                --ink: var(--paper); }
#residential_lobby     { --fill: var(--c-residential_lobby);     --ink: var(--midnight); }
#residential_bike_room { --fill: var(--c-residential_bike_room); --ink: var(--paper); }
#activated_plaza       { --fill: var(--c-activated_plaza);       --ink: var(--midnight); }
#paseo                 { --fill: var(--c-paseo);                 --ink: var(--paper); }
#pieces > .piece.is-hot, #pieces > .piece.is-selected { --fill: var(--rust); --ink: var(--paper); }

.piece .roof, .piece [class$="-tread"] { fill: var(--fill); }
.piece .face, .piece [class$="-riser"], .piece [class$="-cheek"] { fill: color-mix(in srgb, var(--fill) 78%, var(--midnight)); }
.piece polygon { stroke: var(--paper); stroke-width: .9; stroke-linejoin: round; transition: fill 200ms ease; }
.piece [class$="-riser"], .piece [class$="-tread"] { stroke-width: .6; }
.detail { stroke: var(--paper); stroke-width: .6; opacity: .7; }
.mullion { stroke: var(--paper); stroke-width: .5; opacity: .4; }

.arrow { stroke: var(--midnight); stroke-width: 1.2; }
.arrowhead { fill: var(--midnight); }
.arc { fill: none; stroke: var(--midnight); stroke-width: 1.2; stroke-dasharray: 2 6; }

.lbl { fill: var(--ink, var(--midnight)); font-weight: var(--w-regular); font-size: 19px; letter-spacing: .04em; }
.lbl-ctx { fill: var(--slate); font-weight: var(--w-book); font-size: 17px; letter-spacing: .06em; }
#visual_connection_arcs .lbl-ctx { fill: var(--midnight); }

/* ---------- interaction ---------- */
.piece { cursor: pointer; outline: none; transform: translateY(var(--lift, 0px)); }
#context, #circulation_arrows, .piece { transition: transform 400ms ease var(--delay, 0ms), opacity 200ms ease; }

/* everything else dims to 40% */
svg.has-focus #context, svg.has-focus #circulation_arrows,
svg.has-focus .piece:not(.is-hot):not(.is-selected) { opacity: .4; }

.footprint .foot { fill: none; stroke: var(--midnight); stroke-width: .9; stroke-dasharray: 4 4; }
.footprint { opacity: 0; transition: opacity 300ms ease var(--delay, 0ms); }
.footprint.is-on { opacity: .8; }
/* leaders and the route draw in: their dash length is set to the path length in js */
.leader { fill: none; stroke: var(--midnight); stroke-width: 1;
  stroke-dasharray: var(--len, 0) 10000; stroke-dashoffset: var(--len, 0);
  transition: stroke-dashoffset 400ms ease var(--delay, 0ms); }
.leader.is-on { stroke-dashoffset: 0; }
.leader-dot { fill: var(--midnight); opacity: 0; transition: opacity 300ms ease var(--delay, 0ms); }
.leader-dot.is-on { opacity: 1; }

/* circulation toggle */
#visual_connection_arcs { opacity: 0; transition: opacity 400ms ease; }
.show-circulation #visual_connection_arcs { opacity: 1; }
.route { fill: none; stroke: var(--rust); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: 0;
  stroke-dasharray: var(--len, 0) 10000; stroke-dashoffset: var(--len, 0); transition: stroke-dashoffset 1400ms ease; }
.show-circulation .route { stroke-dashoffset: 0; opacity: 1; }
.route-flow { fill: none; stroke: var(--paper); stroke-width: 4; stroke-dasharray: 3 21;
  opacity: 0; transition: opacity 300ms ease; animation: flow 1.2s linear infinite; }
.show-circulation .route-flow { opacity: 1; transition-delay: 1200ms; }
@keyframes flow { to { stroke-dashoffset: -24; } }

@media (prefers-reduced-motion: reduce) {
  .piece, .leader, .footprint, .route, .route-flow, .cover { transition-duration: 1ms !important; animation: none; }
}
</style>

<script>
/* ---------- copy: edit names, descriptions and slides here ---------- */
const PLANS = {
  podium: {
    title: "podium circulation",
    meta: "357 n. green street · dpd intake presentation · 09.08.2026",
    pieces: {
      paseo:                 { name: "paseo / public pedestrian path", label: "paseo", desc: "placeholder: public pedestrian path linking n green st (+0') to the n halsted st viaduct (+25')." },
      activated_plaza:       { name: "activated plaza",       desc: "placeholder: public plaza with stepped seating and stairs rising toward n halsted st." },
      retail:                { name: "retail",                desc: "placeholder: two-level retail wrapping the corner of n green st and w kinzie st." },
      residential_lobby:     { name: "residential lobby",     desc: "placeholder: residential entry off the activated plaza." },
      residential_bike_room: { name: "residential bike room", desc: "placeholder: resident bike storage with direct access from the paseo." }
    },
    context: {
      n_green_st:     "n. green st. (+0')",
      n_halsted_st:   "n. halsted st. (+25')",
      w_kinzie_st:    "w. kinzie st.",
      b_333_n_green:  "333 n green",
      b_360_n_green:  "360 n green"
    },
    labels: {
      visual_connection: "visual connection"
    }
  }
};

/* key rows after the program pieces (which are listed automatically, in their colors) */
const KEY = [
  { mark: "selected",  text: "selected / hovered" },
  { mark: "footprint", text: "footprint of a lifted piece" },
  { mark: "route",     text: "paseo route, green st to halsted st" },
  { mark: "arc",       text: "visual connection" },
  { mark: "arrow",     text: "access / circulation" },
  { mark: "context",   text: "context massing" }
];

/* one entry per slide. piece: lift that piece; explode / circulation: set those states */
const SLIDES = [
  { type: "cover", title: "357 n green street", sub: "podium circulation · dpd intake presentation · 09.08.2026" },
  { plan: "podium", title: "podium circulation", body: "placeholder: the podium opens the block between n green st (+0') and the n halsted st viaduct (+25'). hover or tap a piece to read about it." },
  { plan: "podium", piece: "paseo" },
  { plan: "podium", piece: "activated_plaza" },
  { plan: "podium", piece: "retail" },
  { plan: "podium", piece: "residential_lobby" },
  { plan: "podium", piece: "residential_bike_room" },
  { plan: "podium", title: "circulation", circulation: true, body: "placeholder: the paseo carries the public from n green st up the plaza stairs to n halsted st, with visual connections across both streets." },
  { plan: "podium", title: "exploded", explode: true, body: "placeholder: the podium program separated. select any piece to read about it, or reset to reassemble." }
];

/* ---------- motion ---------- */
const LIFT = 150;                         // svg units a selected piece rises
const EXPLODE = {                         // svg units per piece for "explode all"
  activated_plaza: 40, paseo: 95, residential_bike_room: 150, retail: 205, residential_lobby: 270
};
const STAGGER = 90;                       // ms between pieces when exploding

/* ---------- key swatches ---------- */
const box = fill => `<rect x="1" y="2" width="30" height="12" fill="${fill}"/>`;
const MARKS = {
  selected:  box("var(--rust)"),
  footprint: '<rect x="1" y="2" width="30" height="12" fill="none" stroke="var(--midnight)" stroke-dasharray="3 3"/>',
  route:     '<line x1="2" y1="8" x2="30" y2="8" stroke="var(--rust)" stroke-width="4" stroke-linecap="round"/>',
  arc:       '<path d="M1,12 Q16,0 31,12" fill="none" stroke="var(--midnight)" stroke-width="1.2" stroke-dasharray="2 4"/>',
  arrow:     '<line x1="1" y1="8" x2="24" y2="8" stroke="var(--midnight)" stroke-width="1.2"/><polygon points="31,8 23,4 23,12" fill="var(--midnight)"/>',
  context:   '<rect x="1" y="2" width="30" height="12" fill="color-mix(in srgb, var(--slate) 14%, var(--paper))" stroke="var(--slate)"/>'
};

(function () {
  const deck = document.getElementById("deck");
  const svg = document.getElementById("plan_podium");
  const plan = PLANS.podium;
  const $ = sel => svg.querySelector(sel);
  const pieces = [...svg.querySelectorAll(".piece")];
  const order = pieces.slice();
  const layer = $("#pieces");

  // copy into the drawing
  svg.querySelectorAll("[data-copy]").forEach(el => {
    const val = el.dataset.copy.split(".").reduce((o, k) => o && o[k], plan);
    if (typeof val === "string") el.textContent = val;
  });
  pieces.forEach(p => p.setAttribute("aria-label", plan.pieces[p.dataset.piece].name));

  // key: program pieces (clickable) then the symbols
  const sw = inner => `<svg viewBox="0 0 32 16" aria-hidden="true">${inner}</svg>`;
  const key = document.getElementById("key");
  key.innerHTML =
    Object.entries(plan.pieces).map(([k, p]) =>
      `<li><button type="button" data-piece="${k}">${sw(box(`var(--c-${k})`))}${p.name}</button></li>`).join("") +
    KEY.map((r, i) => `<li${i === 0 ? ' class="gap"' : ""}>${sw(MARKS[r.mark])}${r.text}</li>`).join("");
  document.getElementById("footer_meta").textContent = plan.meta;

  const route = $("#route_base");
  if (route) route.style.setProperty("--len", Math.ceil(route.getTotalLength()));

  const titleEl = document.getElementById("slide_title");
  const bodyEl = document.getElementById("slide_body");
  const circBtn = document.getElementById("btn_circ");
  let selected = null, exploded = false, hot = null, slide = 0, slideCopy = { title: "", body: "" };

  const byKey = k => svg.querySelector(`.piece[data-piece="${k}"]`);
  const forKey = k => svg.querySelectorAll(`[data-for="${k}"]`);

  function lift(k, amount, delay = 0) {
    byKey(k).style.setProperty("--lift", -amount + "px");
    byKey(k).style.setProperty("--delay", delay + "ms");
    forKey(k).forEach(el => {
      el.style.setProperty("--delay", delay + "ms");
      if (el.matches(".leader") && amount > 0) {
        el.setAttribute("d", `M${el.dataset.x},${el.dataset.y} V${el.dataset.y - amount}`);
        el.style.setProperty("--len", amount);
      }
      el.classList.toggle("is-on", amount > 0);
    });
  }

  function paint() {
    pieces.forEach(p => {
      p.classList.toggle("is-hot", p.dataset.piece === hot);
      p.classList.toggle("is-selected", p.dataset.piece === selected);
    });
    svg.classList.toggle("has-focus", !!(hot || selected));
    const k = hot || selected;
    titleEl.textContent = k ? plan.pieces[k].name : slideCopy.title;
    bodyEl.textContent = k ? plan.pieces[k].desc : slideCopy.body;
  }

  const restoreOrder = () => order.forEach(p => layer.appendChild(p));

  function select(k) {
    if (selected === k) return reset();
    if (exploded) { exploded = false; order.forEach(p => p.dataset.piece !== k && lift(p.dataset.piece, 0)); }
    if (selected) lift(selected, 0);
    restoreOrder();
    selected = k;
    layer.appendChild(byKey(k));            // draw the lifted piece over its neighbours
    lift(k, LIFT);
    paint();
  }

  function reset() {
    order.slice().reverse().forEach((p, i) => lift(p.dataset.piece, 0, exploded ? i * STAGGER / 2 : 0));
    selected = null; exploded = false;
    setTimeout(() => { if (!selected) restoreOrder(); }, 450);
    paint();
  }

  function explodeAll() {
    restoreOrder();
    selected = null; exploded = true;
    order.forEach((p, i) => lift(p.dataset.piece, EXPLODE[p.dataset.piece] ?? LIFT, i * STAGGER));
    paint();
  }

  function setCirculation(on) {
    circBtn.setAttribute("aria-pressed", on);
    circBtn.textContent = on ? "hide circulation" : "show circulation";
    svg.classList.toggle("show-circulation", on);
  }

  // ---------- slides ----------
  const dots = document.getElementById("dots");
  dots.innerHTML = SLIDES.map(() => "<i></i>").join("");

  function go(n) {
    slide = Math.max(0, Math.min(SLIDES.length - 1, n));
    const s = SLIDES[slide];
    deck.classList.toggle("is-cover", s.type === "cover");
    if (s.type === "cover") {
      document.getElementById("cover_title").textContent = s.title;
      document.getElementById("cover_sub").textContent = s.sub;
    } else {
      document.getElementById("section").textContent = plan.title;
      slideCopy = s.piece
        ? { title: plan.pieces[s.piece].name, body: plan.pieces[s.piece].desc }
        : { title: s.title, body: s.body };
      hot = null;
      if (s.explode) explodeAll();
      else if (s.piece) { if (selected !== s.piece) select(s.piece); }
      else reset();
      setCirculation(!!s.circulation);
      paint();
    }
    document.getElementById("counter").textContent =
      String(slide + 1).padStart(2, "0") + " / " + String(SLIDES.length).padStart(2, "0");
    [...dots.children].forEach((d, i) => d.classList.toggle("on", i === slide));
    document.getElementById("prev").disabled = slide === 0;
    document.getElementById("next").disabled = slide === SLIDES.length - 1;
  }

  // ---------- input ----------
  const hover = k => { hot = k; paint(); };
  const unhover = k => { if (hot === k) { hot = null; paint(); } };
  pieces.forEach(p => {
    const k = p.dataset.piece;
    p.addEventListener("pointerenter", e => { if (e.pointerType !== "touch") hover(k); });
    p.addEventListener("pointerleave", () => unhover(k));
    p.addEventListener("focus", () => hover(k));
    p.addEventListener("blur", () => unhover(k));
    p.addEventListener("click", e => { e.stopPropagation(); select(k); });
    p.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); select(k); }
    });
  });
  svg.addEventListener("click", () => { if (selected) reset(); });

  key.addEventListener("click", e => { const b = e.target.closest("button"); if (b) select(b.dataset.piece); });
  key.addEventListener("mouseover", e => { const b = e.target.closest("button"); if (b) hover(b.dataset.piece); });
  key.addEventListener("mouseleave", () => { hot = null; paint(); });

  document.getElementById("btn_explode").addEventListener("click", explodeAll);
  document.getElementById("btn_reset").addEventListener("click", () => { reset(); setCirculation(false); });
  circBtn.addEventListener("click", () => setCirculation(circBtn.getAttribute("aria-pressed") !== "true"));
  document.getElementById("prev").addEventListener("click", () => go(slide - 1));
  document.getElementById("next").addEventListener("click", () => go(slide + 1));
  document.getElementById("start").addEventListener("click", () => go(1));

  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "PageDown") go(slide + 1);
    else if (e.key === "ArrowLeft" || e.key === "PageUp") go(slide - 1);
    else if (e.key === "Escape") reset();
  });

  // swipe between slides on touch (taps still select pieces)
  let sx = null, sy = null;
  deck.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  deck.addEventListener("touchend", e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(slide + (dx < 0 ? 1 : -1));
    sx = null;
  });

  go(0);
})();
</script>
</body>
</html>
